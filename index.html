    :root {

      background: linear-gradient(120deg, #1a6e50 0%, #1a6e50 55%, #176046 100%);
      border: 1px solid #23805e;
    }
    header::before { /* tigela côncava (cúpula da Câmara) */

    }
    header > * { position: relative; z-index: 1; }
    @media (max-width: 700px) { header::before { opacity: 0.25; } }
    header .subtitle { color: #cfeadd; }
    header button { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); color: #fff; }
    header button:hover { background: rgba(255, 255, 255, 0.22); }
    h1 { font-size: 1.6rem; color: var(--text); }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .metric-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .metric-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .metric-value { font-size: 1.8rem; font-weight: bold; margin-top: 8px; color: var(--primary); }

    .progress-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .progress-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 10px; }
    .progress-track { background: #0b2b21; height: 14px; border-radius: 7px; overflow: hidden; }
    .progress-fill { background: linear-gradient(90deg, var(--primary), var(--success)); height: 100%; width: 0%; transition: width 0.3s ease; }

    .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    select, button {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
      padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; outline: none;

    select:focus { border-color: var(--primary); }
    button:hover { background: #1f5a45; }
    .btn-reset { margin-left: auto; color: #f87171; border-color: rgba(248, 113, 113, 0.3); }
    .btn-reset:hover { background: rgba(248, 113, 113, 0.1); }

    .table-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: #0f3226; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    tr:last-child td { border-bottom: none; }
    tr.topic-row td { background: rgba(255, 255, 255, 0.025); }
    tr.topic-row:hover td, tr.sub-row:hover td { background: rgba(255, 255, 255, 0.05); }
    tr.sub-row td { padding: 6px 16px; border-bottom: 1px solid rgba(51, 65, 85, 0.5); }

    tr.group-row td { background: #0f3226; padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .group-inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .group-title { font-weight: 700; font-size: 1.1rem; }
    .group-meta { color: var(--text-muted); font-size: 0.8rem; white-space: nowrap; }

    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .badge-p2 { background: rgba(242, 201, 76, 0.15); color: var(--accent); }
    .badge-p1 { background: rgba(95, 211, 162, 0.15); color: var(--primary); }

    .topic-num { display: inline-block; min-width: 28px; color: var(--primary); font-weight: 700; }
    .topic-title { font-weight: 600; font-size: 0.95rem; }
    .sub-text { padding-left: 28px; color: var(--text-muted); font-size: 0.78rem; line-height: 1.4; }
    .sub-text b { color: var(--accent); font-weight: 600; margin-right: 6px; }
    tr.sub-row input[type="checkbox"] { width: 14px; height: 14px; }

    .checkbox-cell { text-align: center; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
    tr.done td:not(.checkbox-cell) { opacity: 0.5; }
  </style>
</head>

    "materia": "Ciência Política",
    "materiaEdital": "Ciência Política",
    "n": "10",
    "topico": "Formação do Estado brasileiro",
    "subs": []
  },
  {
    "id": "pol_11",
    "bloco": "P2",
    "materia": "Ciência Política",
    "materiaEdital": "Ciência Política",
    "n": "11",
    "topico": "História do voto e dos partidos no Brasil",
    "subs": []
  }
];

    const STORAGE_KEY = "camara_cargo11_progress_v2";
    const FIELDS = ["teoria", "exercicios", "rev1", "rev2"];

    const byId = {};
    const leaves = []; // itens que contam no progresso: subitens, ou o tópico quando não tem subitens
    editalData.forEach(function (item) {
      byId[item.id] = item;
      if (item.subs.length) {
        item.subs.forEach(function (s) { s.id = item.id + "_" + s.n; leaves.push({ id: s.id, materia: item.materia }); });
      } else {
        leaves.push({ id: item.id, materia: item.materia });
      }
    });

    function loadProgress() {
      let p = {};
      try { p = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { p = {}; }
      // migração: marcas antigas feitas no tópico passam para os subitens
      let changed = false;
      editalData.forEach(function (item) {
        if (!item.subs.length || !p[item.id]) return;
        item.subs.forEach(function (s) {
          p[s.id] = p[s.id] || {};
          FIELDS.forEach(function (f) { if (p[item.id][f] && p[s.id][f] === undefined) p[s.id][f] = true; });
        });
        delete p[item.id];
        changed = true;
      });
      if (changed) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {} }
      return p;
    }
    let userProgress = loadProgress();

    function getVal(id, f) { return !!(userProgress[id] && userProgress[id][f]); }
    function setVal(id, f, v) {
      if (!userProgress[id]) userProgress[id] = {};
      userProgress[id][f] = !!v;
    }
    function saveProgress() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(userProgress)); } catch (e) {}
    }
    function allDone(id) { return FIELDS.every(function (f) { return getVal(id, f); }); }

    function populateSubjects() {
      const blocoFilter = document.getElementById("filterBloco").value;
      const select = document.getElementById("filterSubject");
      select.innerHTML = '<option value="all">Todas as Matérias</option>';
      const subjects = [];
      editalData.forEach(function (item) {
        if (blocoFilter !== "all" && item.bloco !== blocoFilter) return;
        if (subjects.indexOf(item.materia) === -1) subjects.push(item.materia);
      });
      subjects.forEach(function (sub) {
        const opt = document.createElement("option");
        opt.value = sub;
        opt.textContent = sub;
        select.appendChild(opt);
      });
    }

    function onBlocoChange() {
      populateSubjects();
      renderTable();
    }

    function leafBox(id, f) {
      return '<td class="checkbox-cell"><input type="checkbox" data-id="' + id + '" data-f="' + f + '"></td>';
    }
    function parentBox(id, f) {
      return '<td class="checkbox-cell"><input type="checkbox" data-parent="' + id + '" data-f="' + f + '"></td>';
    }

    function renderTable() {
      const tbody = document.getElementById("topicsTable");
      tbody.innerHTML = "";

      const blocoFilter = document.getElementById("filterBloco").value;
      const subjectFilter = document.getElementById("filterSubject").value;

      const filtered = editalData.filter(function (item) {
        const matchBloco = blocoFilter === "all" || item.bloco === blocoFilter;
        const matchSubject = subjectFilter === "all" || item.materia === subjectFilter;
        return matchBloco && matchSubject;
      });

      let lastMateria = null;
      filtered.forEach(function (item) {
        if (item.materia !== lastMateria) {
          lastMateria = item.materia;
          const g = document.createElement("tr");
          g.className = "group-row";
          g.setAttribute("data-materia", item.materia);
          g.innerHTML =
            '<td><span class="badge ' + (item.bloco === "P2" ? "badge-p2" : "badge-p1") + '">' + item.bloco + '</span></td>' +
            '<td colspan="5"><div class="group-inner"><span class="group-title" title="' + item.materiaEdital + '">' + item.materia + '</span><span class="group-meta"></span></div></td>';
          tbody.appendChild(g);
        }

        const hasSubs = item.subs.length > 0;
        const tr = document.createElement("tr");
        tr.className = "topic-row";
        tr.setAttribute("data-row", item.id);
        const box = hasSubs ? parentBox : leafBox;
        tr.innerHTML =
          "<td></td>" +
          '<td><span class="topic-num">' + item.n + '</span><span class="topic-title">' + item.topico + "</span></td>" +
          FIELDS.map(function (f) { return box(item.id, f); }).join("");
        tbody.appendChild(tr);

        item.subs.forEach(function (s) {
          const sr = document.createElement("tr");
          sr.className = "sub-row";
          sr.setAttribute("data-row", s.id);
          sr.innerHTML =
            "<td></td>" +
            '<td class="sub-text"><b>' + s.n + "</b>" + s.t + "</td>" +
            FIELDS.map(function (f) { return leafBox(s.id, f); }).join("");
          tbody.appendChild(sr);
        });
      });
      syncUI();
    }

    // Atualiza caixas, linhas esmaecidas, contagens por matéria e métricas sem redesenhar a tabela
    function syncUI() {
      document.querySelectorAll("input[data-id]").forEach(function (el) {
        el.checked = getVal(el.dataset.id, el.dataset.f);
      });
      document.querySelectorAll("input[data-parent]").forEach(function (el) {
        const item = byId[el.dataset.parent];
        const n = item.subs.filter(function (s) { return getVal(s.id, el.dataset.f); }).length;
        el.checked = n === item.subs.length;
        el.indeterminate = n > 0 && n < item.subs.length;
      });
      document.querySelectorAll("tr[data-row]").forEach(function (tr) {
        const id = tr.getAttribute("data-row");
        const item = byId[id];
        let done;
        if (item && item.subs.length) done = item.subs.every(function (s) { return allDone(s.id); });
        else done = allDone(id);
        tr.classList.toggle("done", done);
      });
      document.querySelectorAll("tr.group-row").forEach(function (g) {
        const m = g.getAttribute("data-materia");
        const ls = leaves.filter(function (l) { return l.materia === m; });
        const teoria = ls.filter(function (l) { return getVal(l.id, "teoria"); }).length;
        g.querySelector(".group-meta").textContent = ls.length + " itens · teoria " + teoria + "/" + ls.length;
      });
      updateMetrics();
    }

    function updateMetrics() {
      const total = leaves.length;
      let theory = 0, exercises = 0, rev1 = 0, rev2 = 0;
      leaves.forEach(function (l) {
        if (getVal(l.id, "teoria")) theory++;
        if (getVal(l.id, "exercicios")) exercises++;
        if (getVal(l.id, "rev1")) rev1++;
        if (getVal(l.id, "rev2")) rev2++;
      });
      const percent = Math.round(((theory + exercises + rev1 + rev2) / (total * 4)) * 100);

      document.getElementById("overallPercent").textContent = percent + "%";
      document.getElementById("progressText").textContent = percent + "%";
      document.getElementById("progressBar").style.width = percent + "%";
      document.getElementById("theoryCount").textContent = theory + "/" + total;
      document.getElementById("exercisesCount").textContent = exercises + "/" + total;
      document.getElementById("revisionsCount").textContent = (rev1 + rev2) + "/" + (total * 2);
    }

    document.getElementById("topicsTable").addEventListener("change", function (e) {
      const el = e.target;
      if (!el || el.tagName !== "INPUT") return;
      const f = el.dataset.f;
      if (el.dataset.parent) {
        byId[el.dataset.parent].subs.forEach(function (s) { setVal(s.id, f, el.checked); });
      } else {
        setVal(el.dataset.id, f, el.checked);
      }
      saveProgress();
      syncUI();
    });

    function filterData() { renderTable(); }

    function resetProgress() {
      if (confirm("Deseja realmente zerar todo o progresso marcado?")) {
        userProgress = {};
        saveProgress();
        syncUI();
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userProgress));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "progresso_camara_cargo11.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    populateSubjects();
    renderTable();
  </script>
</body>
</html>
